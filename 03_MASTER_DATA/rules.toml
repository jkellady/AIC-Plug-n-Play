# rules.toml: every attendance rule lives here. The code reads these values and never hard-codes them.
#
# HOW TO INSERT A CLIENT ANSWER (no code change needed):
#   1. Find the rule by its question number (e.g. Q1) or its id.
#   2. Change `value` to the answer.
#   3. Set status = "CONFIRMED". Fill `source` (who said it, where) and `confirmed_on` (YYYY-MM-DD).
#   4. Add one line under [[changes]] at the bottom (date, rule, old, new, source).
#   5. Run:  python -m src.rules check     (must print no errors)
#   6. Rerun the week. Flags tied to that rule turn from amber to green by themselves.
#
# STATUS
#   CONFIRMED = Client gave this answer. Needs `source`.
#   ASSUMED   = working default, waiting for Client. The report shows it amber with its question number.
#   OPEN      = no safe default. The engine shows every option side by side and flags it. Never decides silently.

[meta]
schema_version = 1
allowed_status = ["CONFIRMED", "ASSUMED", "OPEN"]

